{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-0 fw-semibold"><i class="fa-solid fa-user-pen me-2"></i>{% trans "Editar Usuario" %}</h4>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'userlist' %}">
      <i class="fa-solid fa-arrow-left me-1"></i>{% trans "Lista de Usuarios" %}
    </a>
  </div>

  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <div class="alert alert-danger">{{ form.errors }}</div>
    {% endif %}
    {% if message %}
      <div class="alert alert-warning">{{ message }}</div>
    {% endif %}
    <div class="card ui-accent-card" style="--accent-color: #0d6efd;">
      <div class="card-header">
        <span>{% trans "Datos del usuario" %}</span>
      </div>
      <div class="card-body">
        {{ form.as_p }}
      </div>
      <div class="card-footer bg-transparent">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-save me-1"></i>{% trans "Guardar cambios" %}
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
