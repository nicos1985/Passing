{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-0 fw-semibold"><i class="fas fa-plus me-2"></i>{% trans "Crear Permiso" %}</h4>
      <small class="text-muted">{% trans "Elige el usuario a dar permisos" %}</small>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'config' %}">
      <i class="fa-solid fa-gear me-1"></i>{% trans "Configuración" %}
    </a>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="card ui-accent-card" style="--accent-color: #0d6efd;">
      <div class="card-header">
        <span>{% trans "Seleccionar usuario" %}</span>
      </div>
      <div class="card-body">
        {{ usuario_form }}
      </div>
      <div class="card-footer bg-transparent">
        <button type="submit" class="btn btn-primary btn-sm">
          {% trans "Siguiente" %} <i class="fas fa-arrow-right ms-1"></i>
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
