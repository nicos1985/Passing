{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class='justify-content-sm-center passing-form-page legacy-form-layout'>
<div class="d-flex justify-content-center" >

    <div class="card center legacy-form-card">
            <div class="card-title">
                <div class="container" style="height: 105px; padding-top: 20px;">
                    <h2><i class="fas fa-address-card" ></i> {{ title }}</h2>
                    
                </div>
            </div>

            <div class="card-body "style="background-color: #F7F7F7; width: 26rem;">


                    <form class = 'form' method="POST">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <p class="small text-muted">El usuario recibirá un correo para definir su contraseña. Hasta entonces figurará como inactivo.</p>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-address-card"></i> {% trans "Crear usuario" %}
                        </button>
                        <a class="btn btn-outline-secondary btn-sm" href="{% url 'userlist' %}">{% trans "Cancelar" %}</a>
                            
                     
                        
                    </form>
            </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
