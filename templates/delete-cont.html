{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-semibold text-danger"><i class="fas fa-trash me-2"></i>{{ title }}</h4>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'listpass' %}">
      <i class="fa-solid fa-arrow-left me-1"></i>{% trans "Cancelar" %}
    </a>
  </div>

  <div class="card ui-accent-card" style="--accent-color: #dc3545;">
    <div class="card-header">
      <span>{% trans "Confirmar eliminación" %}</span>
    </div>
    <div class="card-body">
      <p class="mb-1">{% trans "¿Estás seguro que deseás borrar esta contraseña de" %}</p>
      <p class="fw-semibold">{{ object.nombre_contra }}</p>
    </div>
    <div class="card-footer bg-transparent d-flex gap-2">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm">
          <i class="fas fa-trash me-1"></i>{% trans "Eliminar" %}
        </button>
      </form>
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'listpass' %}">{% trans "Cancelar" %}</a>
    </div>
  </div>
</div>
{% endblock %}
