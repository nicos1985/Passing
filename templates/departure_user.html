{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-0 fw-semibold"><i class="fa-solid fa-user-minus me-2"></i>{% trans "Baja de Usuario" %}</h4>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'config' %}">
      <i class="fa-solid fa-gear me-1"></i>{% trans "Configurar" %}
    </a>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="card ui-accent-card" style="--accent-color: #dc3545;">
      <div class="card-header">
        <span>{% trans "Datos de la baja" %}</span>
      </div>
      <div class="card-body">
        {{ form.as_p }}
      </div>
      <div class="card-footer bg-transparent">
        <button type="submit" class="btn btn-danger btn-sm">
          <i class="fa-solid fa-save me-1"></i>{% trans "Confirmar baja" %}
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
