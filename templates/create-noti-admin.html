{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="mb-0 fw-semibold"><i class="fas fa-plus me-2"></i>{% trans "Solicitud de permisos" %}</h4>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'listpass' %}">
      <i class="fa-solid fa-bars me-1"></i>{% trans "Lista" %}
    </a>
  </div>

  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <div class="alert alert-danger">{{ form.errors }}</div>
    {% endif %}
    <div class="card ui-accent-card" style="--accent-color: #0d6efd;">
      <div class="card-header">
        <span>{% trans "Datos de la solicitud" %}</span>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">{{ form.id_user_share.label }}</label>
          {{ form.id_user_share }}
        </div>
        <div class="mb-3">
          <label class="form-label">{{ form.comment.label }}</label>
          {{ form.comment }}
        </div>
      </div>
      <div class="card-footer bg-transparent">
        <button class="btn btn-primary btn-sm" type="submit">
          <i class="fa-solid fa-paper-plane me-1"></i>{% trans "Enviar" %}
        </button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
