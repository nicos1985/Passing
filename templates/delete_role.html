{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-semibold text-danger"><i class="fas fa-trash me-2"></i>{% trans "Eliminar Rol" %}</h4>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'roles' %}">
      <i class="fa-solid fa-arrow-left me-1"></i>{% trans "Cancelar" %}
    </a>
  </div>

  <div class="card ui-accent-card" style="--accent-color: #dc3545;">
    <div class="card-header">
      <span>{% trans "Confirmar eliminación" %}</span>
    </div>
    <div class="card-body">
      <p class="mb-1">{% trans "¿Estás seguro que deseás borrar el rol:" %}</p>
      <p class="fw-semibold"><a href="{% url 'permissionrolesupdate' object.id %}">{{ object.rol_name }}</a></p>
    </div>
    <div class="card-footer bg-transparent d-flex gap-2">
      <a class="btn btn-danger btn-sm" href="{% url 'deleterolepk' object.id %}">
        <i class="fas fa-trash me-1"></i>{% trans "Eliminar" %}
      </a>
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'roles' %}">{% trans "Cancelar" %}</a>
    </div>
  </div>
</div>
{% endblock %}
