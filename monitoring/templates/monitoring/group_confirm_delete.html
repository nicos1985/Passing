{% extends "base.html" %}
{% load static %}
{% block head %}<link rel="stylesheet" href="{% static 'monitoring/forms.css' %}">{% endblock %}
{% block content %}
<div class="container py-4 monitor-form passing-form-page" style="max-width:700px"><header class="form-hero"><div><div class="ui-muted-title">Monitoreo / Grupos</div><h1>Eliminar grupo</h1></div><a class="btn btn-outline-light" href="{% url 'monitoring:groups' %}">Volver</a></header><div class="card form-card"><div class="card-body p-4"><p>¿Eliminar el grupo <strong>{{ group.name }}</strong>?</p><p class="text-muted">Sus {{ group.monitors.count }} monitores no se eliminan: quedarán en <strong>Sin grupo</strong>.</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Eliminar grupo</button> <a class="btn btn-outline-secondary" href="{% url 'monitoring:groups' %}">Cancelar</a></form></div></div></div>
{% endblock %}
